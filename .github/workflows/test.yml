name: Tests

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno lint
        run: deno task lint

      - name: Run Deno check
        run: deno task check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Playwright and Chromium
        run: uv run --with playwright playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: uv run --with playwright python tests/test_e2e.py
